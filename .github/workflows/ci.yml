name: Test and deploy
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: chat-ui/package-lock.json
      - run: dotnet build GroqChat.slnx --configuration Release
      - run: dotnet run --project GeminiHello.Checks --configuration Release --no-build
      - run: npm ci
        working-directory: chat-ui
      - run: npm test
        working-directory: chat-ui
      - run: npm run build
        working-directory: chat-ui
      - name: Publish backend
        run: dotnet publish ChatApi/ChatApi.csproj --configuration Release -p:PublishProfile=MonsterAsp
      - uses: actions/upload-artifact@v4
        with:
          name: monsterasp-backend
          path: artifacts/monsterasp/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: netlify-frontend
          path: chat-ui/dist/
          if-no-files-found: error

  deploy-backend:
    needs: check
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: windows-latest
    environment:
      name: production
      url: https://groq-chat.runasp.net/api/health
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: monsterasp-backend
          path: artifacts/monsterasp
      - name: Ensure Web Deploy is installed
        shell: pwsh
        run: |
          $exe = 'C:\Program Files\IIS\Microsoft Web Deploy V3\msdeploy.exe'
          if (-not (Test-Path $exe)) {
            choco install webdeploy --yes --no-progress
            if ($LASTEXITCODE -ne 0) { throw 'Web Deploy installation failed.' }
          }
      - name: Deploy using MonsterASP publish profile
        shell: pwsh
        env:
          MONSTERASP_PUBLISH_PROFILE: ${{ secrets.MONSTERASP_PUBLISH_PROFILE }}
        run: ./scripts/deploy_webdeploy.ps1 -PublishDirectory ./artifacts/monsterasp
      - name: Verify backend health
        shell: pwsh
        run: |
          for ($attempt = 1; $attempt -le 6; $attempt++) {
            try {
              $health = Invoke-RestMethod 'https://groq-chat.runasp.net/api/health' -TimeoutSec 20
              if (-not $health.configured) { throw 'Set GROQ_API_KEY in MonsterASP.' }
              Write-Host 'Backend is online and the Groq key is configured.'
              break
            } catch {
              if ($attempt -eq 6) { throw 'Health check failed. Check MonsterASP logs and GROQ_API_KEY.' }
              Start-Sleep -Seconds 5
            }
          }
